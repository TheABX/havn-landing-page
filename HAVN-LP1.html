<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVN - Landing Page 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 3rem 0;
            color: white;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .content {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-top: 2rem;
        }

        .section {
            margin-bottom: 2rem;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .section p {
            margin-bottom: 1rem;
            color: #666;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: white;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HAVN</h1>
            <p class="subtitle">Landing Page 1</p>
        </header>

        <div class="content">
            <section class="section">
                <h2>Welcome</h2>
                <p>This is your HAVN landing page. Customize this content to match your needs.</p>
            </section>

            <section class="section">
                <h2>About</h2>
                <p>Add your content here to describe your product, service, or project.</p>
            </section>
        </div>

        <footer>
            <p>&copy; 2024 HAVN. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
